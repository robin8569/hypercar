# 实时同步上游 fw867/hypercar：每 10 分钟比对一次版本号，
# 上游一发新版就把上游合进 carplus-ocar，版本号沿用上游（tag 与主线同名同号），
# 再显式触发 Build Release APK 出正式包并发布 Release。
#
# 四个设计要点：
#   1. 便宜：首步只用两个 HTTP 请求读 version.properties（raw.githubusercontent），
#      不 checkout、不 clone。版本一样就直接退出，整轮约 15 秒。
#   2. 自愈：判定条件不是「版本不同」，而是「版本不同 或 当前版本还没有对应 Release」，
#      这样某次 dispatch 失败、构建被取消造成的漏发，下一轮（≤10 分钟）自动补上。
#   3. GITHUB_TOKEN 推的 commit 不会触发其它 workflow（GitHub 防递归机制），
#      所以合并完必须显式 `gh workflow run android-ci.yml`。
#   4. 合并冲突不可能自动解决：冲突就中止 + 尽力开 issue，绝不硬合、绝不带冲突出包。
#
# 可选 Secret：SYNC_TOKEN（fine-grained PAT，Contents: write + Workflows: write）。
#   - 不配也能用默认 GITHUB_TOKEN；唯一限制是：上游若改动了 .github/workflows/**，
#     用 GITHUB_TOKEN 推不动这类文件，推送会被拒（run 会红并明确报错）。
#   - 配了之后推送走 PAT，push 本身也会触发一次构建（会被下面的 dispatch 按
#     concurrency 规则合并成一次出包）。
name: Sync Upstream

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分钟比对一次（GitHub 最短调度粒度是 5 分钟）
  workflow_dispatch:
    inputs:
      publish:
        description: '同步后是否顺带发布 Release'
        type: boolean
        default: true
      force:
        description: '版本相同且已有 Release 也走一遍（仅用于验证 dispatch 链路）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false # 合并过程中不要被下一轮打断

env:
  UPSTREAM: fw867/hypercar
  BRANCH: carplus-ocar

jobs:
  sync:
    name: 实时同步上游并触发正式出包
    runs-on: ubuntu-latest
    steps:
      - name: 比对版本与 Release（不 checkout）
        id: cmp
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          up=$(curl -fsSL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${UPSTREAM}/main/version.properties" \
            | sed -n 's/^versionName=//p')
          cur=$(curl -fsSL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${REPO}/${BRANCH}/version.properties" \
            | sed -n 's/^versionName=//p')
          if [ -z "$up" ] || [ -z "$cur" ]; then
            echo "::error::读不到版本号（上游=$up 分支=$cur）"
            exit 1
          fi
          echo "上游 versionName=$up，分支 versionName=$cur"

          merge=false
          [ "$up" != "$cur" ] && merge=true
          build=$merge
          if [ "$build" = "false" ] && ! gh release view "v${cur}" --repo "$REPO" >/dev/null 2>&1; then
            echo "v${cur} 还没有对应 Release，准备补发一次（自愈）"
            build=true
          fi
          case "${FORCE:-false}" in true|True) build=true; echo "force=true，强制走一遍链路" ;; esac

          # 自愈必须有刹车，否则一旦构建持续失败就会每 10 分钟重试一次、烧满 CI。
          # 只在「仅补发、不合并」的路径上刹车：合并出的是新提交，本来就该重跑构建。
          if [ "$build" = "true" ] && [ "$merge" = "false" ]; then
            SHA=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)
            active=$(gh run list --repo "$REPO" --workflow android-ci.yml --branch "$BRANCH" --limit 20 \
              --json headSha,status \
              --jq "[.[]|select(.headSha==\"${SHA}\" and (.status==\"queued\" or .status==\"in_progress\"))]|length")
            failed=$(gh run list --repo "$REPO" --workflow android-ci.yml --branch "$BRANCH" --limit 20 \
              --json headSha,status,conclusion \
              --jq "[.[]|select(.headSha==\"${SHA}\" and .status==\"completed\" and .conclusion!=\"success\" and .conclusion!=\"cancelled\")]|length")
            if [ "${active:-0}" -gt 0 ]; then
              echo "::notice::该提交已有构建在排队/运行中，本轮不重复触发"
              build=false
            elif [ "${failed:-0}" -ge 2 ]; then
              echo "::warning::该提交的构建已连续失败 ${failed} 次，暂停自动补发，请人工看失败的 run（补发上限 2 次/提交）"
              build=false
            fi
          fi

          {
            echo "upstream=$up"
            echo "merge=$merge"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: 检出功能分支
        if: steps.cmp.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: carplus-ocar
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: 合并上游（无冲突才推）
        if: steps.cmp.outputs.merge == 'true'
        id: merge
        run: |
          set -eu
          git config user.name "hypercar-sync"
          git config user.email "sync@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git" || true
          git fetch upstream main --tags
          if ! git merge --no-ff upstream/main \
              -m "sync(upstream): 合并上游 v${{ steps.cmp.outputs.upstream }}"; then
            echo "::warning::与上游 v${{ steps.cmp.outputs.upstream }} 存在冲突，已中止合并"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          if ! git push origin "HEAD:${BRANCH}"; then
            echo "::error::推送合并结果失败。若报 workflow 权限错误，说明上游改动了 .github/workflows/**：GITHUB_TOKEN 推不动这类文件，配置 Secret SYNC_TOKEN（fine-grained PAT，Contents: write + Workflows: write）即可。"
            exit 1
          fi

      - name: 冲突时开 issue 通知
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          VERSION: ${{ steps.cmp.outputs.upstream }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # 开 issue 只是通知手段，失败（例如 Issues 被禁用）不影响「中止同步」这个主结果
          if gh issue create \
              --repo "$REPO" \
              --title "上游 v${VERSION} 合并冲突，需要手工解" \
              --body "自动同步把上游 v${VERSION} 合进 carplus-ocar 时发生冲突，已中止，本次未出包。本地执行 git fetch upstream main 后 git merge upstream/main 解冲突；version.properties 一律取上游值；解决后 push，再到 Actions 手动跑一次 Build Release APK 并勾选 publish。" ; then
            echo "已开 issue 通知"
          else
            echo "::warning::自动开 issue 失败（可能 Issues 被禁用）；同步已中止，看本次 run 的失败通知即可"
          fi
          echo "::error::上游 v${VERSION} 合并冲突，已中止，未出包"
          exit 1

      - name: 触发正式出包
        if: steps.cmp.outputs.build == 'true' && steps.merge.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ steps.cmp.outputs.upstream }}
        run: |
          set -eu
          WANT="${PUBLISH:-true}"
          case "$WANT" in true|True) PUBLISH_FLAG=true ;; *) PUBLISH_FLAG=false ;; esac
          if ! gh workflow run android-ci.yml --ref "${BRANCH}" -f publish="$PUBLISH_FLAG"; then
            echo "::error::触发 Build Release APK 失败（创建 workflow_dispatch 事件被拒）。检查本 workflow 是否声明 actions: write，以及仓库 Settings → Actions → General 的 Workflow permissions 是否为 Read and write。"
            exit 1
          fi
          echo "已触发 Build Release APK（publish=$PUBLISH_FLAG），目标版本 v${VERSION}"
